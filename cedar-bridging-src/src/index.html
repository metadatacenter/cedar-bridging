<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>CEDAR Bridging</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- This div is needed when targeting ES5. It will add the adapter to browsers that support customElements, which require ES6 classes -->
  <div id="ce-es5-shim">
    <script type="text/javascript">
      if (!window.customElements) {
        const ceShimContainer = document.querySelector('#ce-es5-shim');
        ceShimContainer.parentElement.removeChild(ceShimContainer);
      }
    </script>
    <script type="text/javascript" src="node_modules/@webcomponents/webcomponentsjs/custom-elements-es5-adapter.js"></script>
  </div>
  <!-- load the webcomponents loader, which injects the necessary polyfill bundle -->
  <script type="text/javascript" src="node_modules/@webcomponents/webcomponentsjs/webcomponents-loader.js"></script>
  <!-- load the component -->
  <!--
    Copied as an asset and loaded by tag, rather than imported by app.module or
    listed in angular.json's `scripts`. An import puts 2.2 MB of editor into this
    application's own bundle, and a `scripts` entry is re-minified by this build,
    which drops the static initializers in CEE's esbuild bundle and leaves the
    custom element unregistered. The file arrives minified; nothing here needs to
    touch it.
  -->
  <script type="text/javascript" src="node_modules/cedar-embeddable-editor/cedar-embeddable-editor.js"></script>
</head>
<body class="mat-typography">
<app-root></app-root>
</body>
</html>
