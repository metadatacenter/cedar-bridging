<div class="flex-container-doi-requester">
  <div class="flex-child1">
    @if (showProgress || showSuccess || showError) {
      <div class="notify-container">
        @if (showProgress) {
          <div class="notify-progress">
            <mat-spinner [diameter]="16" class="notify-progress-icon"></mat-spinner>{{progressMessage}}
          </div>
        }
        @if (showSuccess) {
          <div class="notify-success">{{successMessage}}
            <button type="button" class="close" (click)="clearSuccess()">
              <span aria-hidden="true">&times;</span>
            </button>
          </div>
        }
        @if (showError) {
          <div class="notify-error">
            <pre>{{errorMessage}}</pre>
            <button type="button" class="close" (click)="clearError()">
              <span aria-hidden="true">&times;</span>
            </button>
          </div>
        }
      </div>
    }
  </div>
  <div>
    <button mat-raised-button color="primary" class="save-doi-button" (click)="saveDoi($event)">Save Draft</button>
  </div>
</div>
